# IN THE WORLD photo wall, shown in this order.
#   image:   path under assets/img/world/ (jpg/png/webp, ~2000px on the long side is plenty)
#   kicker:  short label above the caption, e.g. "Talk", "Program", "Partnership"
#   caption: one line: what / where / year
#   alt:     description for screen readers (defaults to the caption)
#   size:    l (wide, 2/3 row) | m (portrait, 1/3 row) | w (half row)
#   year:    optional; with a year the photo also appears on the About timeline
#   id:      optional short name (e.g. ncsd-forum) so the timeline can link to it
#
# The six entries below are PLACEHOLDERS until real photos arrive: replace
# image/kicker/caption and delete `placeholder: true`.
- kicker: Talk
  caption: Photo and caption to come
  size: m
  placeholder: true
